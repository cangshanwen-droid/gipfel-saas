name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  backend-tests:
    name: 云端后端 pytest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.8'
      - name: 安装依赖
        run: |
          pip install -r requirements.txt
          pip install pytest httpx
      - name: 运行核心测试
        run: python -m pytest tests/ -v
